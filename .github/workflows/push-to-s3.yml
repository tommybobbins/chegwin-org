name: Upload Website to S3

on:
  push:
    branches:
    - main

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Read .env
        id: hugo-version
        run: |
          . ./.env
          echo "HUGO_VERSION=${HUGO_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: '${{ steps.hugo-version.outputs.HUGO_VERSION }}'
          extended: true

#      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
#        with:
#          path: /tmp/hugo_cache_s3
#          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.sum') }}
#          restore-keys: |
#            ${{ runner.os }}-hugomod-


      - name: Build
        run: |
             cd hugo 
             hugo -D --config hugo.toml

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.ACTIONS_AWS_ROLE }}
          role-session-name: SyncToS3

      - name: Deploy static site to S3 bucket
        run: aws s3 sync ./hugo/public/ s3://${{ vars.AWS_WWW_BUCKET_NAME }}/
        #run: aws s3 ls s3://${{ vars.AWS_WWW_BUCKET_NAME }}/ 

      - name: Clear CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.AWS_CLOUDFRONT_ID }} --paths "/*"
